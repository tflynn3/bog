name: Architecture

on: pull_request

permissions:
  contents: read

jobs:
  architecture:
    name: Linux architecture fitness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./internal/archtest
