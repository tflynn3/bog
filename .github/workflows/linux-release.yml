name: Linux release verification

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full lowercase commit SHA to qualify
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOENV: 'off'
  GOFLAGS: ''
  GOAMD64: v1
  GOARM64: v8.0
  CGO_ENABLED: '0'
  FIXTURE: linux-release-v1
  REVISION: ${{ inputs.revision }}
  GATE_REVISION: ${{ github.workflow_sha }}

jobs:
  verify:
    name: Verify native Linux ${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
            runner_arch: X64
            machine: x86_64
            elf_machine: Advanced Micro Devices X86-64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            machine: aarch64
            elf_machine: AArch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      EXPECTED_GOARCH: ${{ matrix.goarch }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      EXPECTED_ELF_MACHINE: ${{ matrix.elf_machine }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Record fixture and check revision input
        run: |
          EVIDENCE="$RUNNER_TEMP/bog-release-evidence"
          mkdir -p "$EVIDENCE"
          printf 'EVIDENCE=%s\nBINARY=%s\n' "$EVIDENCE" "$RUNNER_TEMP/bog-release-candidate" >> "$GITHUB_ENV"
          {
            printf 'revision=%q\ngate_revision=%s\nfixture=%s\ngoarch=%s\n' \
              "$REVISION" "$GATE_REVISION" "$FIXTURE" "$EXPECTED_GOARCH"
            uname -a
            printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            cat /etc/os-release
            nproc
            findmnt --target "$RUNNER_TEMP"
            findmnt --target /sys/fs/cgroup
          } | tee "$EVIDENCE/run.txt"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full lowercase commit SHA" | tee -a "$EVIDENCE/run.txt"; exit 1; }
          [[ "$RUNNER_OS" == Linux && "$(uname -s)" == Linux ]]
          [[ "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" && "$(uname -m)" == "$EXPECTED_MACHINE" ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: candidate
          persist-credentials: false

      - name: Record fixture configuration
        run: |
          gate_head=$(git -C gate rev-parse HEAD)
          printf 'gate_checkout=%s\n' "$gate_head" | tee -a "$EVIDENCE/run.txt"
          [[ "$gate_head" == "$GATE_REVISION" ]]
          cp gate/verify/release/README.md "$EVIDENCE/fixture.md"
          cp candidate/verify/linux/README.md "$EVIDENCE/durability-fixture.md"
          cp candidate/bench/retained-history/README.md "$EVIDENCE/capacity-fixture.md"
          cp candidate/verify/fuzz/README.md "$EVIDENCE/recovery-fixture.md"
          cp candidate/internal/history/LIMITS.md "$EVIDENCE/resource-limits.md"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - name: Build pinned candidate
        id: build
        working-directory: candidate
        timeout-minutes: 6
        run: |
          {
            head=$(git rev-parse HEAD)
            changes=$(git status --porcelain)
            printf 'HEAD=%s\n' "$head"
            [[ "$head" == "$REVISION" && -z "$changes" ]]
            go version
            expected=$(printf 'go1.27.0\nlinux\n%s\nlinux\n%s\nlocal\n0' "$EXPECTED_GOARCH" "$EXPECTED_GOARCH")
            [[ "$(go env GOVERSION GOOS GOARCH GOHOSTOS GOHOSTARCH GOTOOLCHAIN CGO_ENABLED)" == "$expected" ]]
            go build -trimpath -buildvcs=true -o "$BINARY" ./cmd/bog
            LC_ALL=C readelf -h "$BINARY" | tee "$EVIDENCE/elf-header.txt"
            machine=$(awk -F ': *' '/^[[:space:]]*Machine:/ { print $2 }' "$EVIDENCE/elf-header.txt")
            [[ "$machine" == "$EXPECTED_ELF_MACHINE" ]]
            go version -m "$BINARY" | tee "$EVIDENCE/build-info.txt"
            for setting in GOOS=linux "GOARCH=$EXPECTED_GOARCH" CGO_ENABLED=0 \
              "vcs.revision=$REVISION" vcs.modified=false; do
              grep -Fxq $'\tbuild\t'"$setting" "$EVIDENCE/build-info.txt"
            done
            chmod a-w "$BINARY"
            sha256sum "$BINARY" | tee "$EVIDENCE/binary.sha256"
          } 2>&1 | tee "$EVIDENCE/build.log"

      - name: Run release evidence producers
        if: steps.build.outcome == 'success'
        timeout-minutes: 54
        run: |
          record() {
            local name=$1 status=$2
            printf '%s revision=%s exit=%d\n' "$name" "$REVISION" "$status" | tee -a "$EVIDENCE/producers.txt"
          }
          common=(-binary "$BINARY" -revision "$REVISION" -fixture "$FIXTURE")
          admission() (
            cd gate || exit
            timeout --kill-after=5s 2m go run ./verify/release "${common[@]}" -report "$EVIDENCE/admission.json"
          )
          filesystem() (
            local mount_dir status=0
            mount_dir=$(mktemp -d "${TMPDIR:-/tmp}/bog-release-mount.XXXXXXXX") || exit
            # A private namespace also drops the mount if the probe is killed.
            sudo -n timeout --kill-after=3s 15s unshare --mount --propagation private \
              /bin/bash -euo pipefail -c '
                mount -t tmpfs -o size=8m,nr_inodes=4096,nodev,nosuid,noexec bog-release-probe "$1"
                trap '\''umount -- "$1"'\'' EXIT
                findmnt --mountpoint "$1"
                [[ "$(findmnt -n -o FSTYPE --mountpoint "$1")" == tmpfs ]]
                umount -- "$1"
                trap - EXIT
              ' filesystem "$mount_dir" || status=$?
            rmdir -- "$mount_dir" || exit
            exit "$status"
          )
          durability() (
            cd candidate || exit
            timeout --kill-after=5s 15m go run ./verify/linux "${common[@]}" -report "$EVIDENCE/durability.json"
          )
          capacity() (
            cd candidate || exit
            work=$(mktemp -d "$RUNNER_TEMP/bog-capacity.XXXXXXXX") || exit
            cleanup() {
              local status=$?
              rm -rf -- "$work" || status=1
              exit "$status"
            }
            trap cleanup EXIT
            timeout --kill-after=5s 2m go build -trimpath -o "$work/capacity" ./bench/retained-history || exit
            timeout --kill-after=5s 26m sudo -n systemd-run --quiet --wait --pipe --collect --expand-environment=no \
              --uid="$(id -u)" --gid="$(id -g)" -p 'Delegate=memory io' -p DelegateSubgroup=runner \
              -p RuntimeMaxSec=24min -p TimeoutStopSec=10s -p KillMode=control-group \
              /bin/bash -euo pipefail -c '
                work=$1 evidence=$2
                shift 2
                read -r unified </proc/self/cgroup
                [[ "$unified" == 0::/*/runner ]]
                group="/sys/fs/cgroup${unified#0::}"
                parent="${group%/*}"
                [[ "$(stat -f -c %T "$parent")" == cgroup2fs ]]
                printf "+memory +io\n" > "$parent/cgroup.subtree_control"
                read -r enabled < "$parent/cgroup.subtree_control"
                [[ " $enabled " == *" memory "* && " $enabled " == *" io "* ]]
                {
                  printf "capacity_mode=live\ncapacity_cgroup=%s\ncapacity_work_dir=%s\n" "$parent" "$work"
                  cat "$parent/cgroup.controllers" "$parent/cgroup.subtree_control"
                  findmnt --target "$work"
                  df -h "$work"
                } | tee "$evidence/capacity-runner.txt"
                exec "$work/capacity" "$@" -mode live -cgroup-parent "$parent" \
                  -work-dir "$work" -report "$evidence/capacity.json"
              ' capacity "$work" "$EVIDENCE" "${common[@]}"
          )
          parity() (
            cd gate || exit
            export BOG_RELEASE_BINARY="$BINARY" BOG_RELEASE_REVISION="$REVISION" BOG_RELEASE_FIXTURE="$FIXTURE"
            export BOG_RELEASE_PARITY_REPORT="$EVIDENCE/parity.json"
            timeout --kill-after=5s 3m go test -json -count=1 -run '^TestReleaseRestoredParity$' ./verify/release
          )
          failed=0
          for name in filesystem admission durability capacity parity; do
            status=0
            "$name" 2>&1 | tee "$EVIDENCE/$name.log" || status=$?
            record "$name" "$status"
            if (( status != 0 )); then failed=1; fi
          done
          exit "$failed"

      - name: Validate reports and candidate identity
        if: always() && steps.build.outcome == 'success'
        working-directory: gate
        timeout-minutes: 3
        run: |
          {
            failed=0
            sha256sum --check "$EVIDENCE/binary.sha256" || failed=1
            go run ./verify/release validate -binary "$BINARY" -revision "$REVISION" -fixture "$FIXTURE" \
              -admission "$EVIDENCE/admission.json" -durability "$EVIDENCE/durability.json" \
              -capacity "$EVIDENCE/capacity.json" -parity "$EVIDENCE/parity.json" || failed=1
            # The generic ENOSPC verdict predates the descriptor retarget checks.
            python3 - <<'PY' || failed=1
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE"])
          with (evidence / "durability.json").open() as stream:
              retarget = json.load(stream)["cases"]["enospc"]["evidence"]
          expected = {
              "healthy_to_full": {
                  "readiness_status": 200, "readiness_reason": "ready",
                  "ingest_status": 204, "replayed_after_restart": True,
              },
              "full_to_healthy": {
                  "readiness_status": 503, "readiness_reason": "low_disk_headroom",
                  "ingest_status": 503, "post_ingest_reason": "wal_rollback",
                  "post_ingest_category": "enospc",
              },
          }
          for direction, fields in expected.items():
              proof = retarget.get(direction, {})
              for key, value in fields.items():
                  actual = proof.get(key)
                  if type(actual) is not type(value) or actual != value:
                      raise SystemExit(f"Invalid durability evidence for {direction}.{key}: {actual!r}")
          PY
            exit "$failed"
          } 2>&1 | tee "$EVIDENCE/validation.log"

      - name: Race-test release verifier lifecycle
        if: always() && steps.build.outcome == 'success'
        working-directory: candidate
        timeout-minutes: 12
        env:
          CGO_ENABLED: '1'
        run: |
          # Run the full #66 corpus, including new entry points in the candidate.
          # The backup SIGKILL tests are distinct from the durability ENOSPC probe.
          timeout --kill-after=10s 10m go test -race -json -count=1 -timeout=4m \
            ./cmd/bog ./internal/archtest ./internal/backup ./internal/checkpoint ./internal/history \
            ./verify/linux ./verify/release ./bench/retained-history ./verify/fuzz \
            2>&1 | tee "$EVIDENCE/verifier-race.log"

      - name: Require interruption and resource admission test evidence
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 2
        run: |
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/candidate-tests-validation.log"
          import hashlib
          import json
          import os
          from pathlib import Path

          required = {
              "bog/verify/fuzz": ["TestMalformedArtifacts", "FuzzBackup", "FuzzHistory"],
              "bog/internal/backup": [
                  "TestBackupRetryAfterSIGKILL/export",
                  "TestBackupRetryAfterSIGKILL/restore",
                  "TestBackupRetryAfterRenamedPublisherDies",
                  "TestBackupRecoveryPreservesAbandonedStageForOtherDestination",
              ],
              "bog/internal/checkpoint": [
                  "TestBudgetExactLimitsAndSharedOwnership",
                  "TestReplayBudgetAcrossConcurrentAppendAndCapturedFrames",
                  "TestPublisherStagingExactLimit",
                  "TestPublisherCleanupAndRecoveryKeepStagingCharges",
              ],
              "bog/internal/history": [
                  "TestBoundedReplacementAndCaptureDrainOnPinnedDirectory",
                  "TestExpiredCaptureRetainsAnAdmittedScan",
                  "TestLivePublicationKeepsCapturedTailCharged",
              ],
          }
          evidence = Path(os.environ["EVIDENCE"])
          log = evidence / "verifier-race.log"
          outcomes = {}
          with log.open() as stream:
              for line in stream:
                  # Compiler diagnostics may be emitted as plain text.
                  if not line.startswith("{"):
                      continue
                  event = json.loads(line)
                  if event.get("Action") in {"pass", "fail", "skip"}:
                      outcomes[event.get("Package"), event.get("Test")] = event["Action"]

          results = {}
          failures = []
          for package, names in required.items():
              if outcomes.get((package, None)) != "pass":
                  failures.append(f"Missing successful race run for {package}")
              for name in names:
                  status = outcomes.get((package, name), "missing")
                  results[f"{package}/{name}"] = status

          log_hash = hashlib.sha256()
          with log.open("rb") as stream:
              for chunk in iter(lambda: stream.read(65536), b""):
                  log_hash.update(chunk)
          report = {
              "schema_version": 1,
              "revision": os.environ["REVISION"],
              "gate_revision": os.environ["GATE_REVISION"],
              "binary_sha256": (evidence / "binary.sha256").read_text().split()[0],
              "fixture": os.environ["FIXTURE"],
              "goarch": os.environ["EXPECTED_GOARCH"],
              "test_log_sha256": log_hash.hexdigest(),
              "tests": results,
          }
          (evidence / "candidate-tests.json").write_text(json.dumps(report, indent=2) + "\n")
          failures.extend(f"{name}: {status}" for name, status in results.items() if status != "pass")
          if failures:
              raise SystemExit("\n".join(failures))
          print("Required candidate recovery and resource admission tests passed")
          PY

      - name: Publish release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-evidence-${{ matrix.goarch }}
          path: ${{ runner.temp }}/bog-release-evidence
          if-no-files-found: error

  qualification:
    name: Linux release qualification
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both native architectures
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$VERIFY_RESULT" != success ]]; then
            echo "::error::Native Linux amd64 and arm64 qualification must both succeed (matrix: $VERIFY_RESULT)"
            exit 1
          fi
