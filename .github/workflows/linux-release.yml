name: Linux release verification

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full lowercase commit SHA to qualify
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOAMD64: v1
  GOARM64: v8.0
  CGO_ENABLED: '0'
  FIXTURE: linux-release-v1
  REVISION: ${{ inputs.revision }}

jobs:
  verify:
    name: Verify Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            runner_arch: X64
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Record fixture and check revision input
        run: |
          EVIDENCE="$RUNNER_TEMP/bog-release-evidence"
          mkdir -p "$EVIDENCE"
          printf 'EVIDENCE=%s\nBINARY=%s\n' "$EVIDENCE" "$EVIDENCE/candidate" >> "$GITHUB_ENV"
          {
            printf 'revision=%q\nfixture=%s\nexpected_arch=%s\n' "$REVISION" "$FIXTURE" "$EXPECTED_ARCH"
            uname -a
            printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            cat /etc/os-release
            nproc
            findmnt --target "$RUNNER_TEMP"
            findmnt --target /sys/fs/cgroup
          } | tee "$EVIDENCE/run.txt"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full lowercase commit SHA" | tee -a "$EVIDENCE/run.txt"; exit 1; }
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" ]]
          [[ "$(uname -s)" == Linux && "$(uname -m)" == "$EXPECTED_MACHINE" ]]

      - uses: actions/checkout@v4
        with:
          path: gate
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: candidate
          persist-credentials: false

      - name: Record fixture configuration
        run: |
          cp gate/verify/release/README.md "$EVIDENCE/fixture.md"
          cp candidate/verify/linux/README.md "$EVIDENCE/durability-fixture.md"
          cp candidate/bench/retained-history/README.md "$EVIDENCE/capacity-fixture.md"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - name: Build pinned candidate
        id: build
        working-directory: candidate
        timeout-minutes: 6
        run: |
          {
            head=$(git rev-parse HEAD)
            printf 'HEAD=%s\n' "$head"
            [[ "$head" == "$REVISION" ]]
            [[ -z "$(git status --porcelain)" ]]
            go version
            expected=$(printf 'go1.27.0\nlinux\n%s\nlinux\n%s\nlocal\n0' "$EXPECTED_ARCH" "$EXPECTED_ARCH")
            actual=$(go env GOVERSION GOHOSTOS GOHOSTARCH GOOS GOARCH GOTOOLCHAIN CGO_ENABLED)
            if [[ "$actual" != "$expected" ]]; then
              printf 'Unexpected Go version, host, target, toolchain selector, or cgo setting:\n%s\n' "$actual"
              exit 1
            fi
            case "$EXPECTED_ARCH" in
              amd64) [[ "$(go env GOAMD64)" == v1 ]] ;;
              arm64) [[ "$(go env GOARM64)" == v8.0 ]] ;;
              *) exit 1 ;;
            esac
            go build -trimpath -buildvcs=true -o "$BINARY" ./cmd/bog
            go version -m "$BINARY" | tee "$EVIDENCE/build-info.txt"
            grep -Eq "^[[:space:]]+build[[:space:]]+vcs.revision=$REVISION$" "$EVIDENCE/build-info.txt"
            grep -Eq '^[[:space:]]+build[[:space:]]+vcs.modified=false$' "$EVIDENCE/build-info.txt"
            grep -Eq "^[[:space:]]+build[[:space:]]+GOARCH=$EXPECTED_ARCH$" "$EVIDENCE/build-info.txt"
            grep -Eq '^[[:space:]]+build[[:space:]]+GOOS=linux$' "$EVIDENCE/build-info.txt"
            (cd "$EVIDENCE" && sha256sum candidate) | tee "$EVIDENCE/binary.sha256"
          } 2>&1 | tee "$EVIDENCE/build.log"

      - name: Run release evidence producers
        if: steps.build.outcome == 'success'
        timeout-minutes: 48
        run: |
          record() {
            local name=$1 status=$2
            printf '%s revision=%s exit=%d\n' "$name" "$REVISION" "$status" | tee -a "$EVIDENCE/producers.txt"
          }
          common=(-binary "$BINARY" -revision "$REVISION" -fixture "$FIXTURE")
          admission() (
            cd gate || exit
            timeout --kill-after=5s 2m go run ./verify/release "${common[@]}" -report "$EVIDENCE/admission.json"
          )
          durability() (
            cd candidate || exit
            timeout --kill-after=5s 15m go run ./verify/linux "${common[@]}" -report "$EVIDENCE/durability.json"
          )
          capacity() (
            cd candidate || exit
            work=$(mktemp -d "$RUNNER_TEMP/bog-capacity.XXXXXXXX") || exit
            cleanup() {
              local status=$?
              rm -rf -- "$work" || status=1
              exit "$status"
            }
            trap cleanup EXIT
            go build -trimpath -o "$work/capacity" ./bench/retained-history || exit
            sudo -n systemd-run --quiet --wait --pipe --collect --expand-environment=no \
              --uid="$(id -u)" --gid="$(id -g)" -p 'Delegate=memory io' -p DelegateSubgroup=runner \
              -p RuntimeMaxSec=24min -p TimeoutStopSec=10s \
              /bin/bash -euo pipefail -c '
                work=$1 evidence=$2
                shift 2
                read -r unified </proc/self/cgroup
                [[ "$unified" == 0::/*/runner ]]
                group="/sys/fs/cgroup${unified#0::}"
                parent="${group%/*}"
                printf "+memory +io\n" > "$parent/cgroup.subtree_control"
                {
                  printf "capacity_mode=live\ncapacity_cgroup=%s\ncapacity_work_dir=%s\n" "$parent" "$work"
                  cat "$parent/cgroup.controllers" "$parent/cgroup.subtree_control"
                  findmnt --target "$work"
                  df -h "$work"
                } | tee "$evidence/capacity-runner.txt"
                exec "$work/capacity" "$@" -mode live -cgroup-parent "$parent" \
                  -work-dir "$work" -report "$evidence/capacity.json"
              ' capacity "$work" "$EVIDENCE" "${common[@]}"
          )
          parity() (
            cd gate || exit
            export BOG_RELEASE_BINARY="$BINARY" BOG_RELEASE_REVISION="$REVISION" BOG_RELEASE_FIXTURE="$FIXTURE"
            export BOG_RELEASE_PARITY_REPORT="$EVIDENCE/parity.json"
            timeout --kill-after=5s 3m go test -json -timeout=2m -count=1 -run '^TestReleaseRestoredParity$' ./verify/release
          )
          failed=0
          for name in admission durability capacity parity; do
            status=0
            "$name" 2>&1 | tee "$EVIDENCE/$name.log" || status=$?
            record "$name" "$status"
            if (( status != 0 )); then failed=1; fi
          done
          exit "$failed"

      - name: Validate reports and candidate identity
        if: always() && steps.build.outcome == 'success'
        working-directory: gate
        timeout-minutes: 3
        run: |
          {
            failed=0
            (cd "$EVIDENCE" && sha256sum --strict --check binary.sha256) || failed=1
            go run ./verify/release validate -arch "$EXPECTED_ARCH" -binary "$BINARY" -revision "$REVISION" -fixture "$FIXTURE" \
              -admission "$EVIDENCE/admission.json" -durability "$EVIDENCE/durability.json" \
              -capacity "$EVIDENCE/capacity.json" -parity "$EVIDENCE/parity.json" || failed=1
            exit "$failed"
          } 2>&1 | tee "$EVIDENCE/validation.log"

      - name: Race-test release verifier lifecycle
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 8
        env:
          CGO_ENABLED: '1'
        run: |
          {
            failed=0
            (cd gate && go test -race -timeout=3m -count=1 ./verify/release) || failed=1
            (cd candidate && go test -race -timeout=4m -count=1 ./internal/archtest ./verify/linux ./bench/retained-history ./verify/fuzz) || failed=1
            exit "$failed"
          } 2>&1 | tee "$EVIDENCE/verifier-race.log"

      - name: Publish release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/bog-release-evidence
          if-no-files-found: error
          overwrite: true

  qualify:
    name: Qualify both Linux architectures
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-release-evidence-*
          path: ${{ runner.temp }}/release-evidence

      - name: Require both native jobs and validate the evidence together
        if: always()
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          failed=0
          if [[ "$VERIFY_RESULT" != success ]]; then
            echo "Native verification matrix ended with $VERIFY_RESULT"
            failed=1
          fi
          go run ./verify/release qualify -evidence "$RUNNER_TEMP/release-evidence" \
            -revision "$REVISION" -fixture "$FIXTURE" || failed=1
          exit "$failed"
