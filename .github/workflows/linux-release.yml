name: Linux release verification

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full lowercase commit SHA to qualify
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOAMD64: v1
  GOARM64: v8.0
  CGO_ENABLED: '0'
  FIXTURE: linux-release-v1
  REVISION: ${{ inputs.revision }}

jobs:
  verify:
    name: Native Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            runner_arch: X64
            machine: x86_64
            tuning_key: GOAMD64
            tuning: v1
          - arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            machine: aarch64
            tuning_key: GOARM64
            tuning: v8.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 105
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      TUNING_KEY: ${{ matrix.tuning_key }}
      EXPECTED_TUNING: ${{ matrix.tuning }}
      RELEASE_PRODUCERS: |-
        admission gate
        durability candidate
        capacity candidate
        parity gate
        fixed_budget_backfill gate
        capacity_control_scope gate
        retained_shutdown gate
    defaults:
      run:
        shell: bash
    steps:
      - name: Record fixture and check revision input
        run: |
          attempt_dir=$(mktemp -d "$RUNNER_TEMP/bog-release-${GITHUB_RUN_ATTEMPT}.XXXXXXXX")
          EVIDENCE="$attempt_dir/evidence"
          mkdir "$EVIDENCE"
          printf 'EVIDENCE=%s\nBINARY=%s\n' "$EVIDENCE" "$attempt_dir/bog-release-candidate" >> "$GITHUB_ENV"
          {
            printf 'revision=%q\ngate_revision=%s\nfixture=%s\nexpected_arch=%s\n' \
              "$REVISION" "$GITHUB_WORKFLOW_SHA" "$FIXTURE" "$EXPECTED_ARCH"
            printf 'run_attempt=%s\nevidence_dir=%s\n' "$GITHUB_RUN_ATTEMPT" "$EVIDENCE"
            uname -a
            printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            cat /etc/os-release
            nproc
            findmnt --target "$RUNNER_TEMP"
            findmnt --target /sys/fs/cgroup
          } | tee "$EVIDENCE/run.txt"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full lowercase commit SHA" | tee -a "$EVIDENCE/run.txt"; exit 1; }
          if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != "$EXPECTED_RUNNER_ARCH" ||
                "$(uname -sm)" != "Linux $EXPECTED_MACHINE" ]]; then
            echo "Native Linux $EXPECTED_ARCH runner unavailable" | tee -a "$EVIDENCE/run.txt"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: candidate
          persist-credentials: false

      - name: Record fixture configuration
        run: |
          gate_head=$(git -C gate rev-parse HEAD)
          printf 'gate_head=%s\n' "$gate_head" | tee -a "$EVIDENCE/run.txt"
          [[ "$gate_head" == "$GITHUB_WORKFLOW_SHA" ]]
          cp gate/verify/release/README.md "$EVIDENCE/fixture.md"
          cp candidate/verify/linux/README.md "$EVIDENCE/durability-fixture.md"
          cp candidate/bench/retained-history/README.md "$EVIDENCE/capacity-fixture.md"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - name: Preflight native delegated capacity runner
        id: runner_preflight
        working-directory: gate
        timeout-minutes: 5
        run: |
          {
            verifier="${BINARY%/*}/bog-runner-verifier"
            timeout --kill-after=5s 2m go build -trimpath -o "$verifier" ./verify/linux || {
              printf 'Runner preflight verifier build failed (failure_kind=infrastructure).\n' >&2
              exit 1
            }
            status=0
            timeout --signal=TERM --kill-after=30s 30s bash verify/linux/delegated-runner.sh "$verifier" preflight \
              -arch "$EXPECTED_ARCH" -revision "$REVISION" -fixture "$FIXTURE" \
              -report "$EVIDENCE/runner-preflight.json" || status=$?
            if [[ ! -s "$EVIDENCE/runner-preflight.json" ]]; then
              printf 'Runner preflight produced no report (exit=%d). Check verifier build and systemd delegation.\n' "$status" >&2
              exit 1
            fi
            cat "$EVIDENCE/runner-preflight.json"
            exit "$status"
          } 2>&1 | tee "$EVIDENCE/runner-preflight.log"

      - name: Build pinned candidate
        id: build
        if: steps.runner_preflight.outcome == 'success'
        working-directory: candidate
        timeout-minutes: 6
        run: |
          {
            head=$(git rev-parse HEAD)
            printf 'HEAD=%s\n' "$head"
            [[ "$head" == "$REVISION" ]]
            tree_status=$(git status --porcelain)
            [[ -z "$tree_status" ]]
            go version
            go_config=$(go env GOVERSION GOHOSTOS GOHOSTARCH GOOS GOARCH GOTOOLCHAIN "$TUNING_KEY" CGO_ENABLED)
            printf '%s\n' "$go_config"
            expected_config=$(printf '%s\n' go1.27.0 linux "$EXPECTED_ARCH" linux "$EXPECTED_ARCH" local "$EXPECTED_TUNING" 0)
            [[ "$go_config" == "$expected_config" ]]
            go build -trimpath -buildvcs=true -o "$BINARY" ./cmd/bog
            go version -m "$BINARY" | tee "$EVIDENCE/build-info.txt"
            grep -Eq "^[[:space:]]+build[[:space:]]+vcs.revision=$REVISION$" "$EVIDENCE/build-info.txt"
            grep -Eq '^[[:space:]]+build[[:space:]]+vcs.modified=false$' "$EVIDENCE/build-info.txt"
            for setting in GOOS=linux "GOARCH=$EXPECTED_ARCH" "$TUNING_KEY=$EXPECTED_TUNING" CGO_ENABLED=0; do
              grep -Fxq $'\tbuild\t'"$setting" "$EVIDENCE/build-info.txt"
            done
            sha256sum "$BINARY" | tee "$EVIDENCE/binary.sha256"
          } 2>&1 | tee "$EVIDENCE/build.log"

      - name: Preflight release commands and strict validators
        id: preflight
        if: steps.build.outcome == 'success'
        timeout-minutes: 5
        run: |
          require_flags() {
            local command=$1 usage=$2
            shift 2
            printf '%s\n%s\n' "$command" "$usage"
            for flag in "$@"; do
              if ! grep -Eq "^[[:space:]]+-${flag}([[:space:]]|$)" <<< "$usage"; then
                printf '%s does not advertise -%s\n' "$command" "$flag" >&2
                return 1
              fi
            done
          }
          require_tests() {
            local package=$1 pattern output test status=0
            shift
            pattern=$(IFS='|'; printf '^(%s)$' "$*")
            output=$(timeout --kill-after=5s 1m go test -v -count=1 -run "$pattern" "$package" 2>&1) || status=$?
            printf '%s\n' "$output"
            if (( status != 0 )); then return "$status"; fi
            for test in "$@"; do
              if ! grep -Eq "^--- PASS: ${test} \\(" <<< "$output"; then
                printf '%s did not pass required test %s\n' "$package" "$test" >&2
                return 1
              fi
            done
          }
          {
            python3 -B gate/verify/release/check_gate_evidence_test.py || exit
            release_help=$(cd gate && timeout --kill-after=5s 1m go run ./verify/release validate -help 2>&1) ||
              { printf 'gate report validator help failed\n%s\n' "$release_help" >&2; exit 1; }
            require_flags "gate report validator" "$release_help" binary revision fixture admission durability capacity parity require-cutover query-model-events query-handler-events
            cutover_help=$(cd gate && timeout --kill-after=5s 1m go run ./bench/retained-history -help 2>&1) ||
              { printf 'gate capacity validator help failed\n%s\n' "$cutover_help" >&2; exit 1; }
            require_flags "gate capacity validator" "$cutover_help" validate-cutover
            producer_help=$(cd candidate && timeout --kill-after=5s 1m go run ./bench/retained-history -help 2>&1) ||
              { printf 'candidate capacity producer help failed\n%s\n' "$producer_help" >&2; exit 1; }
            require_flags "candidate capacity producer" "$producer_help" binary revision fixture mode cgroup-parent work-dir report
            candidate_help=$(timeout --kill-after=5s 10s "$BINARY" -help 2>&1) ||
              { printf 'candidate server help failed\n%s\n' "$candidate_help" >&2; exit 1; }
            require_flags "candidate server" "$candidate_help" addr data-dir query-concurrency query-max-response-bytes query-work-budget
            (
              cd gate
              require_tests ./verify/release TestValidateCommand TestValidateRecoveryEvidence \
                TestValidateCutoverCapacityProof TestValidatePostRestoreAckCrashEvidence TestValidateQueryQualification
              require_tests ./bench/retained-history TestStrictCutoverReportProof
              require_tests ./verify/capacityevidence TestValidateCapacityObservations
            )
            (
              cd candidate
              require_tests ./bench/retained-history TestLivePinProbeWithRepeatedMetrics TestLiveRuntimeMetricsRoundTrip
            )
          } 2>&1 | tee "$EVIDENCE/preflight.log"

      - name: Run release evidence producers
        if: steps.preflight.outcome == 'success'
        timeout-minutes: 55
        run: |
          record() {
            local name=$1 status=$2 checkout=$3 checkout_sha=$4
            printf '%s revision=%s arch=%s exit=%d checkout=%s checkout_sha=%s\n' \
              "$name" "$REVISION" "$EXPECTED_ARCH" "$status" "$checkout" "$checkout_sha" | tee -a "$EVIDENCE/producers.txt"
          }
          common=(-binary "$BINARY" -revision "$REVISION" -fixture "$FIXTURE")
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          admission() (
            timeout --kill-after=5s 2m go run ./verify/release "${common[@]}" -report "$EVIDENCE/admission.json"
          )
          durability() (
            verifier="${BINARY%/*}/bog-durability-verifier"
            timeout --kill-after=5s 2m go build -trimpath -o "$verifier" ./verify/linux || exit
            fixture_parent=$(mktemp -d "$RUNNER_TEMP/bog-durability.XXXXXXXX") || exit
            cleanup() {
              local status=$?
              if rmdir -- "$fixture_parent"; then
                printf 'durability_fixture_parent_removed=%s\n' "$fixture_parent" || status=1
              else
                printf 'durability_fixture_cleanup_failed=%s\n' "$fixture_parent" >&2
                if (( status == 0 )); then status=1; fi
              fi
              exit "$status"
            }
            trap cleanup EXIT
            printf 'durability_fixture_parent=%s\n' "$fixture_parent" || exit
            sudo -n systemd-run --quiet --wait --pipe --collect --expand-environment=no \
              --uid="$runner_uid" --gid="$runner_gid" -p PrivateMounts=yes \
              -p RuntimeMaxSec=15min -p TimeoutStopSec=30s \
              --setenv="TMPDIR=$fixture_parent" "$verifier" \
              "${common[@]}" -report "$EVIDENCE/durability.json"
          )
          capacity() (
            work=$(mktemp -d "$RUNNER_TEMP/bog-capacity.XXXXXXXX") || exit
            cleanup() {
              local status=$?
              if ! rm -f -- "$work/capacity"; then
                printf 'capacity_producer_cleanup_failed=%s\n' "$work/capacity" >&2
                if (( status == 0 )); then status=1; fi
              fi
              if rmdir -- "$work"; then
                printf 'capacity_fixture_parent_removed=%s\n' "$work" || status=1
              else
                printf 'capacity_fixture_parent_left_nonempty=%s\n' "$work" >&2
                if (( status == 0 )); then status=1; fi
                if [[ -s "$EVIDENCE/capacity-runner.json" ]]; then
                  if rm -rf --one-file-system -- "$work"; then
                    printf 'capacity_fixture_parent_removed_after_failure=%s\n' "$work"
                  else
                    printf 'capacity_fixture_cleanup_failed=%s\n' "$work" >&2
                  fi
                fi
              fi
              exit "$status"
            }
            trap cleanup EXIT
            timeout --kill-after=5s 2m go build -trimpath -o "$work/capacity" ./bench/retained-history || {
              printf 'Capacity producer build failed (failure_kind=infrastructure).\n' >&2
              exit 1
            }
            read -r digest _ < "$EVIDENCE/binary.sha256" || exit
            sha256sum --check "$EVIDENCE/binary.sha256" || exit
            {
              printf 'capacity_mode=live\ncapacity_work_dir=%s\n' "$work" || exit
              findmnt --target "$work" || exit
              df -h "$work" || exit
            } | tee "$EVIDENCE/capacity-runner.txt" || exit
            status=0
            bash ../gate/verify/linux/delegated-runner.sh "${BINARY%/*}/bog-runner-verifier" capacity \
              -arch "$EXPECTED_ARCH" -sha256 "$digest" "${common[@]}" \
              -producer "$work/capacity" -work-dir "$work" -capacity-report "$EVIDENCE/capacity.json" \
              -report "$EVIDENCE/capacity-runner.json" || status=$?
            if [[ ! -s "$EVIDENCE/capacity-runner.json" ]]; then
              printf 'Capacity service produced no runner evidence (exit=%d). Check systemd service output.\n' "$status" >&2
              exit 1
            fi
            exit "$status"
          )
          run_candidate_test() (
            local test=$1 events=$2
            shift 2
            export BOG_RELEASE_BINARY="$BINARY" BOG_RELEASE_REVISION="$REVISION" BOG_RELEASE_FIXTURE="$FIXTURE"
            timeout --kill-after=5s 3m go test -json -count=1 -run "^${test}\$" ./verify/release |
              tee "$events" || exit
            python3 "$GITHUB_WORKSPACE/gate/verify/release/check_gate_evidence.py" test-events \
              "$events" bog/verify/release "$test" "$@"
          )
          parity() (
            export BOG_RELEASE_PARITY_REPORT="$EVIDENCE/parity.json"
            run_candidate_test TestReleaseRestoredParity "$EVIDENCE/parity-events.jsonl" || exit
            if [[ ! -s "$BOG_RELEASE_PARITY_REPORT" ]]; then
              echo "TestReleaseRestoredParity did not produce a nonempty parity report" >&2
              exit 1
            fi
          )
          fixed_budget_backfill() (
            run_candidate_test TestReleaseFixedBudgetBackfill "$EVIDENCE/fixed-budget-backfill-events.jsonl" \
              tied duplicates sparse
          )
          capacity_control_scope() (
            run_candidate_test TestReleaseCapacityControlScope "$EVIDENCE/capacity-control-scope-events.jsonl" \
              loopback_without_opt_in loopback_with_opt_in_disabled wildcard_with_opt_in loopback_with_opt_in ipv6_loopback_with_opt_in
          )
          retained_shutdown() (
            local digest events="$EVIDENCE/retained-shutdown-events.jsonl"
            read -r digest _ < "$EVIDENCE/binary.sha256" || exit
            sha256sum --check "$EVIDENCE/binary.sha256" || exit
            export CGO_ENABLED=1 BOG_RELEASE_RETAINED_SHUTDOWN=1 BOG_RELEASE_BINARY_SHA256="$digest"
            export BOG_RELEASE_BINARY="$BINARY" BOG_RELEASE_REVISION="$REVISION" BOG_RELEASE_FIXTURE="$FIXTURE"
            timeout --kill-after=5s 3m go test -race -json -count=1 -timeout=90s \
              -run '^TestReleaseRetainedShutdown$' ./verify/release | tee "$events" || exit
            sha256sum --check "$EVIDENCE/binary.sha256" || exit
            python3 verify/release/check_gate_evidence.py test-events \
              "$events" bog/verify/release TestReleaseRetainedShutdown
          )
          failed=0
          while read -r -u 3 name checkout; do
            checkout_sha=$(git -C "$checkout" rev-parse HEAD) || { failed=1; continue; }
            statuses=(0 0)
            (cd "$checkout" && "$name") 2>&1 | tee "$EVIDENCE/$name.log" || statuses=("${PIPESTATUS[@]}")
            record "$name" "${statuses[0]}" "$checkout" "$checkout_sha" || failed=1
            if (( statuses[0] != 0 || statuses[1] != 0 )); then failed=1; fi
          done 3<<< "$RELEASE_PRODUCERS"
          exit "$failed"

      - name: Qualify O1 history under 256 MiB on both starts
        if: steps.preflight.outcome == 'success'
        timeout-minutes: 3
        run: |
          read -r digest _ < "$EVIDENCE/binary.sha256"
          sha256sum --check "$EVIDENCE/binary.sha256"
          python=$(command -v python3)
          sudo -n systemd-run --quiet --wait --pipe --collect --expand-environment=no \
            --uid="$(id -u)" --gid="$(id -g)" -p Delegate=memory -p DelegateSubgroup=runner \
            -p KillMode=control-group -p RuntimeMaxSec=125s -p TimeoutStopSec=5s \
            "$python" "$GITHUB_WORKSPACE/candidate/verify/release/o1_journey.py" "$BINARY" \
            --revision "$REVISION" --sha256 "$digest" --work-dir "$RUNNER_TEMP" |
            tee "$EVIDENCE/o1-journey.json"
          sha256sum --check "$EVIDENCE/binary.sha256"

      - name: Race-test candidate runtime and release verifier lifecycle
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        env:
          CGO_ENABLED: '1'
        run: |
          candidate_storage_race() (
            cd candidate || exit
            local checkout_sha repetitions=3 events="$EVIDENCE/candidate-storage-race-events.jsonl"
            checkout_sha=$(git rev-parse HEAD) || exit
            [[ "$checkout_sha" == "$REVISION" ]] || exit 1
            printf 'candidate storage race checkout_sha=%s arch=%s fixture=%s repetitions=%d\n' \
              "$checkout_sha" "$EXPECTED_ARCH" "$FIXTURE" "$repetitions" || exit
            sha256sum --check "$EVIDENCE/binary.sha256" || exit
            cat "$EVIDENCE/binary.sha256" || exit
            timeout --kill-after=5s 180s go test -json -race -count="$repetitions" -timeout=160s \
              -run '^(TestQueuedGroupAndClose|TestCheckpointSegmentCeiling)$' ./internal/wal ./verify/fuzz |
              tee "$events" || exit
            sha256sum --check "$EVIDENCE/binary.sha256" || exit
            python3 - "$events" "$repetitions" <<'PY'
          import json
          import re
          import sys
          from collections import Counter

          path, repetitions = sys.argv[1:]
          wal = ("bog/internal/wal", "TestQueuedGroupAndClose")
          ceiling = ("bog/verify/fuzz", "TestCheckpointSegmentCeiling")
          required = {
              "cancel-staged-block", "manifest-budget", "sigkill-staged", "recover-overlap",
              "recover-retirement", "sigkill-1", "rename-enoent", "sigkill-2",
          }
          worker_result = re.compile(r"\s*--- (PASS|FAIL|SKIP): TestCheckpointSegmentCeiling/(\S+) \([^)]+\)\s*")
          passes = Counter()
          cases = Counter()
          with open(path, encoding="utf-8") as events:
              for line in events:
                  event = json.loads(line)
                  target = (event.get("Package"), event.get("Test"))
                  if target not in (wal, ceiling):
                      continue
                  action = event["Action"]
                  if action in ("fail", "skip"):
                      sys.exit(f"{target[1]} reported {action}")
                  if target == ceiling and action == "output":
                      # The ceiling test logs its subprocess's verbose test output.
                      match = worker_result.fullmatch(event["Output"])
                      if match and match[2] in required:
                          if match[1] != "PASS":
                              sys.exit(f"{ceiling[1]}/{match[2]} reported {match[1]}")
                          cases[match[2]] += 1
                  if action == "pass":
                      if target == ceiling:
                          for case in sorted(required):
                              if cases[case] != 1:
                                  sys.exit(f"{ceiling[1]}/{case} reported {cases[case]} passes "
                                           f"in repetition {passes[ceiling] + 1}, expected 1")
                          cases.clear()
                      passes[target] += 1
          for target in (wal, ceiling):
              if passes[target] != int(repetitions):
                  sys.exit(f"{target[1]} reported {passes[target]} passes, expected {repetitions}")
          print(f"PASS {wal[1]} ({repetitions} repetitions)")
          print(f"PASS {ceiling[1]} ({repetitions} repetitions each): {', '.join(sorted(required))}")
          PY
          )
          race_checkout() (
            local checkout=$1 expected_sha=$2 checkout_sha status=0
            shift 2
            cd "$checkout" || exit
            checkout_sha=$(git rev-parse HEAD) || exit
            printf 'race checkout=%s checkout_sha=%s arch=%s packages=%s\n' \
              "$checkout" "$checkout_sha" "$EXPECTED_ARCH" "$*" || exit
            if [[ "$checkout_sha" == "$expected_sha" ]]; then
              timeout --kill-after=5s 285s go test -race -count=1 "$@" || status=$?
            else
              printf 'race expected checkout SHA %s\n' "$expected_sha" >&2 || exit
              status=1
            fi
            printf 'race checkout=%s checkout_sha=%s exit=%d arch=%s packages=%s\n' \
              "$checkout" "$checkout_sha" "$status" "$EXPECTED_ARCH" "$*" || exit
            exit "$status"
          )
          query_race() (
            local checkout=$1 expected_sha=$2 events=$3 checkout_sha status=0
            shift 3
            cd "$checkout" || exit
            checkout_sha=$(git rev-parse HEAD) || exit
            [[ "$checkout_sha" == "$expected_sha" ]] || exit 1
            printf 'query race checkout=%s checkout_sha=%s revision=%s arch=%s events=%s\n' \
              "$checkout" "$checkout_sha" "$REVISION" "$EXPECTED_ARCH" "$events" || exit
            sha256sum --check "$EVIDENCE/binary.sha256" || exit
            export BOG_QUERY_VERIFY_104=1
            export BOG_RELEASE_BINARY="$BINARY" BOG_RELEASE_REVISION="$REVISION" BOG_RELEASE_FIXTURE="$FIXTURE"
            timeout --kill-after=5s 285s go test -json -race -count=1 "$@" ./verify/query-model |
              tee "$EVIDENCE/$events" || status=$?
            printf 'query race checkout=%s checkout_sha=%s exit=%d\n' "$checkout" "$checkout_sha" "$status" || exit
            sha256sum --check "$EVIDENCE/binary.sha256" || exit
            exit "$status"
          )
          {
            failed=0
            candidate_storage_race || failed=1
            race_checkout candidate "$REVISION" ./cmd/bog ./internal/history ./internal/readiness || failed=1
            race_checkout candidate "$REVISION" ./internal/archtest ./verify/linux ./verify/listener \
              ./verify/release ./bench/retained-history ./verify/fuzz || failed=1
            # Gate-owned oracle exercises the pinned binary. Compile the
            # direct handler fixtures with the candidate's HTTP package.
            query_race gate "$GITHUB_WORKFLOW_SHA" query-model-events.jsonl -skip '^TestQuery104' || failed=1
            query_race candidate "$REVISION" query-handler-events.jsonl \
              -run '^(TestQuery104.*|TestQueryCaptureSurvivesFailedOpeningWrite|TestRetainedCaptureRetirementDrainsAtCapacity)$' || failed=1
            if [[ "$GITHUB_WORKFLOW_SHA" != "$REVISION" ]]; then
              race_checkout gate "$GITHUB_WORKFLOW_SHA" ./verify/linux ./verify/listener \
                ./verify/release ./bench/retained-history || failed=1
            fi
            exit "$failed"
          } 2>&1 | tee "$EVIDENCE/verifier-race.log"

      - name: Validate reports and candidate identity
        if: always() && steps.build.outcome == 'success'
        working-directory: gate
        timeout-minutes: 3
        env:
          BOG_RELEASE_REQUIRE_RETARGET: '1'
        run: |
          {
            failed=0
            python3 verify/release/check_gate_evidence.py producers \
              "$EVIDENCE/producers.txt" "$REVISION" "$EXPECTED_ARCH" "$GITHUB_WORKFLOW_SHA" "$RELEASE_PRODUCERS" || failed=1
            sha256sum --check "$EVIDENCE/binary.sha256" || failed=1
            checkout_sha=$(git rev-parse HEAD)
            printf 'release validator checkout=gate checkout_sha=%s\n' "$checkout_sha"
            go run ./verify/release validate -require-cutover -binary "$BINARY" -revision "$REVISION" -fixture "$FIXTURE" \
              -admission "$EVIDENCE/admission.json" -durability "$EVIDENCE/durability.json" \
              -capacity "$EVIDENCE/capacity.json" -parity "$EVIDENCE/parity.json" \
              -query-model-events "$EVIDENCE/query-model-events.jsonl" \
              -query-handler-events "$EVIDENCE/query-handler-events.jsonl" || failed=1
            printf 'capacity validator checkout=gate checkout_sha=%s\n' "$checkout_sha"
            go run ./bench/retained-history -validate-cutover "$EVIDENCE/capacity.json" || failed=1
            exit "$failed"
          } 2>&1 | tee "$EVIDENCE/validation.log"

      - name: Publish release evidence
        if: always() && env.EVIDENCE != ''
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-evidence-${{ matrix.arch }}${{ github.run_attempt != '1' && format('-attempt-{0}', github.run_attempt) || '' }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error

  qualification:
    name: Require both native Linux qualifications
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      NATIVE_RESULT: ${{ needs.verify.result }}
    steps:
      - name: Check native evidence
        shell: bash
        run: |
          if [[ "$NATIVE_RESULT" != success ]]; then
            printf 'Incomplete release evidence for %s. Native verification result: %s. See the amd64 and arm64 jobs for failures or unavailable runner capabilities.\n' \
              "$REVISION" "$NATIVE_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'Native amd64 and arm64 release evidence passed for %s.\n' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
