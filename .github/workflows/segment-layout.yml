name: Segment layout qualification

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full lowercase SHA of the reviewed retained candidate (leave empty for smoke)
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/segment-layout.yml'
      - 'bench/segment-layout/**'
      - 'internal/checkpoint/**'
      - 'internal/history/**'
      - 'internal/store/**'
      - 'internal/wal/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request' || inputs.revision == ''
    name: Native Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    defaults:
      run:
        working-directory: bench/segment-layout
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/segment-layout/go.sum
      - name: Check runner and test benchmark
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_ARCH"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          export TMPDIR="$RUNNER_TEMP"
          go vet ./...
          go test -race -count=1 ./...
      - name: Build and validate incremental and cold smoke reports
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          artifacts="$RUNNER_TEMP/segment-layout-artifacts"
          mkdir "$artifacts"
          go build -o "$artifacts/segment-layout" .
          "$artifacts/segment-layout" -incremental -smoke -seed 44 \
            -revision "$(git rev-parse HEAD)" -dir "$RUNNER_TEMP" > "$artifacts/report.json"
          "$artifacts/segment-layout" -validate-report "$artifacts/report.json"
          "$artifacts/segment-layout" -cold -smoke -seed 44 \
            -revision "$(git rev-parse HEAD)" -dir "$RUNNER_TEMP" > "$artifacts/cold-smoke.json"
          "$artifacts/segment-layout" -validate-report "$artifacts/cold-smoke.json"
          tar -C "$artifacts" -czf "$artifacts/segment-layout.tar.gz" segment-layout
      - uses: actions/upload-artifact@v4
        with:
          name: segment-layout-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/segment-layout-artifacts/segment-layout.tar.gz
            ${{ runner.temp }}/segment-layout-artifacts/report.json
            ${{ runner.temp }}/segment-layout-artifacts/cold-smoke.json
          if-no-files-found: error

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.revision != ''
    name: Live candidate Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            runner_arch: X64
            arch: amd64
            machine: x86_64
            tuning: GOAMD64=v1
          - runner: ubuntu-24.04-arm
            runner_arch: ARM64
            arch: arm64
            machine: aarch64
            tuning: GOARM64=v8.0
    defaults:
      run:
        shell: bash
    env:
      REVISION: ${{ inputs.revision }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      EXPECTED_TUNING: ${{ matrix.tuning }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOAMD64: v1
      GOARM64: v8.0
      CGO_ENABLED: '0'
    steps:
      - name: Check candidate input and runner
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full lowercase commit SHA"; exit 1; }
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" ]]
          [[ "$(uname -sm)" == "Linux $EXPECTED_MACHINE" ]]
          attempt=$(mktemp -d "$RUNNER_TEMP/segment-layout-live.XXXXXXXX")
          mkdir "$attempt/evidence" "$attempt/work"
          printf 'ATTEMPT=%s\n' "$attempt" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: benchmark-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build the clean native release candidate
        working-directory: candidate
        run: |
          head=$(git rev-parse HEAD)
          tree_status=$(git status --porcelain)
          [[ "$head" == "$REVISION" && -z "$tree_status" ]]
          go_config=$(go env GOVERSION GOHOSTOS GOHOSTARCH GOOS GOARCH)
          [[ "$go_config" == "$(printf '%s\n' go1.27.0 linux "$EXPECTED_ARCH" linux "$EXPECTED_ARCH")" ]]
          go build -trimpath -buildvcs=true -o "$ATTEMPT/bog" ./cmd/bog
          build_info="$ATTEMPT/evidence/candidate-build-info.txt"
          go version -m "$ATTEMPT/bog" | tee "$build_info"
          grep -Fxq $'\tpath\tbog/cmd/bog' "$build_info"
          for setting in vcs=git "vcs.revision=$REVISION" vcs.modified=false GOOS=linux "GOARCH=$EXPECTED_ARCH" "$EXPECTED_TUNING" CGO_ENABLED=0; do
            grep -Fxq $'\tbuild\t'"$setting" "$build_info"
          done
          cd "$ATTEMPT"
          sha256sum bog | tee evidence/candidate.sha256
      - name: Measure and validate both live profiles
        working-directory: benchmark-source/bench/segment-layout
        run: |
          benchmark_revision=$(git rev-parse HEAD)
          [[ "$benchmark_revision" == "$GITHUB_WORKFLOW_SHA" ]]
          go build -trimpath -o "$ATTEMPT/segment-layout" .
          read -r digest _ < "$ATTEMPT/evidence/candidate.sha256"
          report="$ATTEMPT/evidence/cold-live-medium.json"
          "$ATTEMPT/segment-layout" -cold -require-live -scale medium -seed 44 -runs 21 \
            -revision "$benchmark_revision" -dir "$ATTEMPT/work" -report "$report" \
            -bog-bin "$ATTEMPT/bog" -bog-revision "$REVISION"
          "$ATTEMPT/segment-layout" -validate-report "$report" -require-live \
            -bog-revision "$REVISION" -bog-sha256 "$digest" -bog-arch "$EXPECTED_ARCH"
          cd "$ATTEMPT"
          sha256sum --check evidence/candidate.sha256
          tar -czf evidence/segment-layout-live.tar.gz segment-layout bog
      - uses: actions/upload-artifact@v4
        with:
          name: segment-layout-live-linux-${{ matrix.arch }}-${{ inputs.revision }}
          path: ${{ env.ATTEMPT }}/evidence/
          if-no-files-found: error
