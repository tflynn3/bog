apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bogs.bog.example.com
spec:
  group: bog.example.com
  scope: Namespaced
  names:
    plural: bogs
    singular: bog
    kind: Bog
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image, replicas, storage]
              properties:
                image: {type: string, minLength: 1}
                replicas: {type: integer, format: int32, minimum: 1, maximum: 1}
                storage: {type: string, minLength: 1}
                storageClassName: {type: string}
