apiVersion: v1
kind: ServiceAccount
metadata:
  name: bog-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bog-operator
rules:
  - apiGroups: [bog.example.com]
    resources: [bogs]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [services]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bog-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bog-operator
subjects:
  - kind: ServiceAccount
    name: bog-operator
    namespace: default
