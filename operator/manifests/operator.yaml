apiVersion: v1
kind: ServiceAccount
metadata:
  name: bog-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bog-operator
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bog-operator
subjects:
  - kind: ServiceAccount
    name: bog-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bog-operator
---
apiVersion: v1
kind: Service
metadata:
  name: bog
spec:
  clusterIP: None
  selector:
    app: bog
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bog-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bog-operator
  template:
    metadata:
      labels:
        app: bog-operator
    spec:
      serviceAccountName: bog-operator
      containers:
        - name: operator
          image: REPLACE_WITH_OPERATOR_IMAGE
          env:
            - name: BOG_IMAGE
              value: REPLACE_WITH_BOG_IMAGE
