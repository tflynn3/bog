# Single-node deployment. Do not scale: Bog has no replication protocol.
apiVersion: v1
kind: Service
metadata:
  name: bog
spec:
  clusterIP: None
  selector:
    app: bog
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bog
spec:
  serviceName: bog
  replicas: 1
  # Manual replacement permits compatibility and backup checks before restart.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: bog
  template:
    metadata:
      labels:
        app: bog
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bog
          image: bog:replace-me
          args: ["-data-dir=/data", "-addr=0.0.0.0:8080"]
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 360
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
